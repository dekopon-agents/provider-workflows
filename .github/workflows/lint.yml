name: Lint

on:
  pull_request:
  push:
    branches: [main]

env:
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"

permissions:
  contents: read

jobs:
  lint:
    name: lint workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # actionlint runs shellcheck (preinstalled on the runner) over every run: block.
      - name: actionlint and shellcheck
        shell: bash
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" actionlint
          shellcheck --version | head -2
          ./actionlint -color -shellcheck shellcheck

  size:
    name: size counter and report
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check out Dekopon history for the baselines
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: dekopon-agents/dekopon
          path: dekopon-history
          fetch-depth: 0
          persist-credentials: false
      - name: Test size reporting
        env:
          SIZE_HISTORY_REPO: dekopon-history
        run: python3 -B -m unittest discover -s ci/tests -v
